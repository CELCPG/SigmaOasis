name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Typecheck & build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Unpacked build only — verifies the bundle compiles without needing
      # signing credentials, which pull requests must never have access to.
      - name: Build (unpacked)
        run: npm run build:unpack
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
