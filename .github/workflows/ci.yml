name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Typecheck & build
    # macOS runs the full suite including the real-Electron window checks.
    # The Linux leg (v1.4.8) proves nothing is macOS-only: the node suite runs in
    # full, and the Electron checks self-skip without a display (xvfb-run
    # provides one so they run there too).
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The Workbench's Python runtime (extraResources in packaged builds;
      # the workbench check suite self-skips without it).
      - name: Fetch Pyodide runtime
        run: bash scripts/fetch-pyodide.sh

      - name: Typecheck
        run: npm run typecheck

      # The node:test suite plus the real-Electron transport/render checks.
      # Runs before the build so a failing test never produces an artifact.
      - name: Test
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a npm test' || 'npm test' }}

      # Unpacked build only — verifies the bundle compiles without needing
      # signing credentials, which pull requests must never have access to.
      - name: Build (unpacked)
        if: runner.os == 'macOS'
        run: npm run build:unpack
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
