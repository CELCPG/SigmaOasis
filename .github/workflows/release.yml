name: Release

# Tagging a version builds, signs, notarizes, and attaches the installers to a
# GitHub Release:
#
#   npm version 1.0.0 && git push --follow-tags
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   APPLE_ID                     Apple ID enrolled in the Developer Program
#   APPLE_APP_SPECIFIC_PASSWORD  from appleid.apple.com → App-Specific Passwords
#   APPLE_TEAM_ID                10-character Team ID
#   CSC_LINK                     base64 of your Developer ID .p12:
#                                  base64 -i cert.p12 | pbcopy
#   CSC_KEY_PASSWORD             password protecting that .p12
#
# Without these the macOS job fails at signing — that is deliberate, so an
# unsigned build is never published as a release.
#
# Every build job waits on `guard`, which refuses a tag that is not on main or
# that disagrees with package.json — see the comment on that job.
#
# Shape of the run: guard → {macOS, Windows, Linux} build in parallel with
# `--publish never` and upload their installers as workflow artifacts → a single
# `publish` job creates one draft release and attaches every asset → the
# Homebrew cask bump reads that release by id. Only `publish` holds
# `contents: write`. Letting each platform job publish for itself is what gave
# v1.6.0 two draft releases with the assets split across them; the long comment
# on `publish` records why.

# On action majors: these are pinned to the first majors that actually *run* on
# Node 24 (checkout v5+, setup-node v5+, upload-artifact v6+, download-artifact
# v7+), taken at current latest. v5 across the board is the obvious-looking bump
# and is not enough — upload-artifact v5 and download-artifact v5/v6 advertised
# "Node 24 support" while still defaulting their own runtime to Node 20, so the
# deprecation warning survives it. `node-version: 20` below is unrelated: that is
# the toolchain the build runs on, not the runtime the action itself uses.

on:
  push:
    tags: ['v*']

jobs:
  # Runs before anything is built, because the failure it catches is invisible
  # in the artifacts. In v1.4.7 a tag was pushed at a commit that had been
  # rebuilt and abandoned; it was on no branch, main had never received it, and
  # the release built, signed, notarized and bumped the Homebrew tap without
  # complaint. Nothing looked wrong — the app source happened to be identical —
  # but the tag named history the repository did not have, and the notes it
  # shipped were a superseded draft. The next such mistake will not be so
  # lucky, so it fails here instead, before the ~6 minutes of notarization and
  # before a draft release and a tap commit exist to clean up.
  #
  # Know what this cannot do. Actions runs the workflow file *from the tagged
  # commit*, not from main, so this guard only exists for tags cut from history
  # that already contains it. Verified the hard way: a probe tag placed on the
  # pre-guard commit produced a run with no guard job in it at all, and built
  # all three platforms. The hole closes for everything committed from here on,
  # but a tag on older history — or on a branch where this file was edited —
  # still runs whatever workflow that tree carries. That is why the repository
  # also has a tag ruleset blocking updates to refs/tags/v*: GitHub enforces
  # that at push time, independent of any workflow, so a release tag cannot be
  # quietly repointed even where this job never runs. Neither mechanism stops a
  # bad tag from being *created*; they stop it from building and from moving.
  guard:
    name: Tag is on main
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # merge-base needs real history; checkout's default shallow fetch has
          # none, and the ancestry test would fail for the wrong reason.
          fetch-depth: 0

      - name: Verify the tag is on main and matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # Fetch main explicitly rather than trusting what checkout left
          # behind: this workflow is checked out at a tag, not a branch.
          git fetch --no-tags --quiet origin +refs/heads/main:refs/remotes/origin/main
          TAG_SHA=$(git rev-parse 'HEAD^{commit}')
          MAIN_SHA=$(git rev-parse origin/main)

          # A commit is its own ancestor, so the ordinary case — tag sitting on
          # main's tip — passes.
          if ! git merge-base --is-ancestor "$TAG_SHA" "$MAIN_SHA"; then
            echo "::error::$TAG points at $TAG_SHA, which is not on main (main is $MAIN_SHA)."
            echo "A release built from here would ship history that main does not contain."
            echo ""
            echo "To fix, drop the tag and re-cut it from main:"
            echo "  gh release delete $TAG --yes          # if a draft was created"
            echo "  git push origin :refs/tags/$TAG"
            echo "  git tag -d $TAG"
            echo "  git checkout main && git merge --ff-only <branch> && git push origin main"
            echo "  git tag $TAG && git push origin $TAG"
            exit 1
          fi

          # The tag is what names the assets and drives the Homebrew bump, while
          # package.json is what electron-builder actually stamps on them. When
          # they disagree the build succeeds and the tap bump fails hunting for
          # an asset that was never built — six minutes later, on a release that
          # already exists.
          VERSION="${TAG#v}"
          PKG=$(jq -r .version package.json)
          if [ "$VERSION" != "$PKG" ]; then
            echo "::error::$TAG implies version $VERSION but package.json says $PKG."
            echo "Assets would be named $PKG while the tag and the tap expect $VERSION."
            exit 1
          fi

          echo "$TAG is on main and package.json agrees ($PKG)."

  macos:
    name: macOS (signed & notarized)
    needs: guard
    runs-on: macos-latest
    # Build-only. Exactly one job writes to the release (see `publish`), and
    # this is enforced by permission, not convention.
    permissions:
      contents: read
    steps:
      # Notarization failures surface as a JSON parse error, not a useful
      # message: when Apple rejects a submission it replies in plain text
      # ("Error: HTTP status code: 403 ..."), and @electron/notarize feeds that
      # straight into JSON.parse, so the log only ever shows
      # `Unexpected token 'E', "Error: HTT"... is not valid JSON`.
      # Asking notarytool the same question up front gets Apple's actual
      # wording into the log, and does it before the 97 MB Electron download
      # and the signing pass rather than after.
      - name: Preflight — verify Apple notary credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=()
          [ -n "$APPLE_ID" ] || missing+=(APPLE_ID)
          [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] || missing+=(APPLE_APP_SPECIFIC_PASSWORD)
          [ -n "$APPLE_TEAM_ID" ] || missing+=(APPLE_TEAM_ID)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secret(s): ${missing[*]}"
            exit 1
          fi

          # A pasted app-specific password often carries a trailing newline or
          # space. Apple answers that with a bare 401, so name it explicitly.
          case "$APPLE_APP_SPECIFIC_PASSWORD" in
            *[[:space:]]) echo "::warning::APPLE_APP_SPECIFIC_PASSWORD ends in whitespace — re-paste it without the trailing character." ;;
          esac

          set +e
          out=$(xcrun notarytool history \
                  --apple-id "$APPLE_ID" \
                  --team-id "$APPLE_TEAM_ID" \
                  --password "$APPLE_APP_SPECIFIC_PASSWORD" 2>&1)
          status=$?
          set -e

          if [ $status -ne 0 ]; then
            echo "::error::Apple rejected these notary credentials (notarytool exit $status). Raw response:"
            echo "$out"
            exit 1
          fi
          echo "Notary credentials accepted by Apple for team $APPLE_TEAM_ID."

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Fetch Pyodide runtime (Workbench)
        run: bash scripts/fetch-pyodide.sh

      - run: npm run typecheck

      # Gates the release: a failing suite stops the signed build here, before
      # any installer is produced. (Windows and Linux jobs stay build-only —
      # the suite's Electron checks need bash and, for some, a display.)
      - run: npm test

      - name: Bundle main, preload & renderer
        run: npx electron-vite build

      - name: Build, sign & notarize
        run: npx electron-builder --mac --publish never
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # Traces the notarytool invocation (args, exit code, temp paths). Note
          # it does NOT reveal Apple's rejection message — @electron/notarize
          # throws inside JSON.parse before it logs the response body. The
          # preflight step above is what surfaces that.
          DEBUG: electron-notarize*

      - name: Hand the signed DMGs to the publish job
        uses: actions/upload-artifact@v7
        with:
          name: installers-mac
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/*.dmg
            dist/*.dmg.blockmap
            dist/latest-mac.yml

  windows:
    name: Windows
    needs: guard
    runs-on: windows-latest
    # Build-only; see the macOS job.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Fetch Pyodide runtime (Workbench)
        run: bash scripts/fetch-pyodide.sh

      - name: Bundle main, preload & renderer
        run: npx electron-vite build

      - name: Build the installer
        run: npx electron-builder --win --publish never

      - name: Hand the installer to the publish job
        uses: actions/upload-artifact@v7
        with:
          name: installers-win
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml

  linux:
    name: Linux
    needs: guard
    runs-on: ubuntu-latest
    # Build-only; see the macOS job.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Fetch Pyodide runtime (Workbench)
        run: bash scripts/fetch-pyodide.sh

      - name: Bundle main, preload & renderer
        run: npx electron-vite build

      # No test run here, like Windows: the macOS job is the test gate for the
      # release, and the suite's Electron checks need a display anyway.
      - name: Build the AppImage
        run: npx electron-builder --linux --publish never

      - name: Hand the AppImage to the publish job
        uses: actions/upload-artifact@v7
        with:
          name: installers-linux
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/*.AppImage
            dist/latest-linux.yml

  # The single writer. Every platform job builds with `--publish never` and
  # hands its installers here, because letting each job publish for itself is
  # what broke v1.6.0.
  #
  # electron-publish decides whether a release already exists by listing
  # releases — `GET /repos/{owner}/{repo}/releases`, chosen deliberately over
  # "get a release by tag name" because a draft has no git tag of its own
  # (gitHubPublisher.js, the comment above the call). On 2026-08-17 that
  # endpoint began returning an empty array for every repository, verified
  # against microsoft/vscode and electron/electron as controls. So all three
  # jobs concluded "release doesn't exist" and each created its own draft:
  # v1.6.0 finished with two drafts a second apart, the signed DMGs on one and
  # the AppImage on the other, `gh release view v1.6.0` resolving to whichever
  # it liked, and the tap bump failing on a release that genuinely had no DMG.
  # Nothing reported failure except the last job in the chain.
  #
  # Uploading from one job removes the dependency on that endpoint and the race
  # along with it: the release is found by GraphQL (which still sees drafts) or
  # created once, and the assets go on it by id.
  publish:
    name: Attach the installers to the release
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      # Checkout precedes the artifact download: actions/checkout cleans the
      # workspace and would eat an assets/ directory that arrived first.
      - uses: actions/checkout@v7

      # v8 defaults `digest-mismatch: error`, so a corrupted transfer fails the
      # job instead of quietly attaching a bad installer to the release. That is
      # the behavior we want here; do not soften it to `warn`.
      - name: Collect every platform's installers
        uses: actions/download-artifact@v8
        with:
          pattern: installers-*
          merge-multiple: true
          path: assets

      # The curated packs as a standalone download (v1.7.1) — for people who
      # want the reference library without (or before) the app, and for
      # anything else that can read the documented pack format. sources/ holds
      # build specs, not documents.
      - name: Zip the curated packs
        run: zip -r -q assets/packs.zip packs -x "packs/sources/*"

      - name: Create or reuse the draft release, then upload
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ls -l assets

          # A filename with a space uploads as "Sigma.Oasis-…" — GitHub rewrites
          # spaces — while latest*.yml points at "Sigma-Oasis-…", so the
          # auto-updater would 404 on a release that looks complete.
          # electron-builder.yml hard-codes the dashed name; this asserts it.
          if ls assets | grep -q ' '; then
            echo "::error::Asset filenames contain spaces — check artifactName in electron-builder.yml"
            exit 1
          fi

          QUERY='query($owner:String!,$name:String!){
            repository(owner:$owner,name:$name){
              releases(first:100, orderBy:{field:CREATED_AT,direction:DESC}){
                nodes{ databaseId tagName }}}}'
          ids=$(gh api graphql -f query="$QUERY" \
                  -f owner="${REPO%/*}" -f name="${REPO#*/}" \
                  --jq "[.data.repository.releases.nodes[] | select(.tagName == \"$TAG\") | .databaseId] | join(\" \")")
          count=$(printf '%s' "$ids" | wc -w | tr -d ' ')

          if [ "$count" -gt 1 ]; then
            echo "::error::$count releases already exist for $TAG (ids: $ids)."
            echo "Delete the extras before re-running — uploading into an arbitrary one is the v1.6.0 failure."
            exit 1
          fi

          if [ "$count" -eq 0 ]; then
            # The same call electron-publish made: a draft against the existing
            # tag, named without the leading v, body left empty for the notes
            # that RELEASING.md says to paste in before publishing.
            id=$(gh api "repos/$REPO/releases" \
                   -f tag_name="$TAG" -f name="${TAG#v}" -F draft=true --jq .id)
            echo "created draft release $id for $TAG"
          else
            id="$ids"
            echo "reusing draft release $id for $TAG"
          fi

          # Replace rather than fail on a re-run: uploading a name that already
          # exists is a 422, and a re-run is the normal way a transient upload
          # failure gets fixed.
          existing=$(gh api "repos/$REPO/releases/$id" --jq '.assets[] | "\(.name) \(.id)"')

          for f in assets/*; do
            name=$(basename "$f")
            old=$(printf '%s\n' "$existing" | awk -v n="$name" '$1 == n { print $2 }')
            if [ -n "$old" ]; then
              echo "replacing existing asset $name"
              gh api -X DELETE "repos/$REPO/releases/assets/$old"
            fi
            echo "uploading $name ($(du -h "$f" | cut -f1))"
            curl -sS --fail-with-body -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$f" \
              -o /dev/null \
              "https://uploads.github.com/repos/$REPO/releases/$id/assets?name=$name"
          done

          echo "release_id=$id" >> "$GITHUB_OUTPUT"

      # Prints the finished asset list, so "the release is missing the DMGs" is
      # visible in the run that caused it rather than days later on the release
      # page. Both DMGs, the installer, the AppImage, the packs archive and the
      # three update manifests.
      - name: Verify the release carries every expected asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          names=$(gh api "repos/${{ github.repository }}/releases/${{ steps.release.outputs.release_id }}" \
                    --jq '.assets[].name' | sort)
          echo "$names" | sed 's/^/asset: /'
          VERSION="${GITHUB_REF_NAME#v}"
          missing=()
          for want in \
            "Sigma-Oasis-${VERSION}-mac-arm64.dmg" \
            "Sigma-Oasis-${VERSION}-mac-x64.dmg" \
            "Sigma-Oasis-${VERSION}-setup.exe" \
            "Sigma-Oasis-${VERSION}-linux.AppImage" \
            packs.zip \
            latest-mac.yml latest.yml latest-linux.yml; do
            printf '%s\n' "$names" | grep -qxF "$want" || missing+=("$want")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::The release is missing: ${missing[*]}"
            exit 1
          fi
          echo "All expected assets are on the release."

  homebrew:
    name: Homebrew cask bump
    # After the signed DMGs land on the release: refresh the tap's version and
    # checksums so `brew install --cask sigma-oasis` tracks every tag. Waits on
    # `publish`, not `macos` — before, it ran as soon as the DMGs were built and
    # raced the release they were meant to be attached to.
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # GITHUB_TOKEN cannot push outside this repo; HOMEBREW_TAP_TOKEN is a PAT
      # with write access to CELCPG/homebrew-tap (see RELEASING.md).
      - uses: actions/checkout@v7
        with:
          repository: CELCPG/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Update cask version and checksums
        env:
          # The PAT, not GITHUB_TOKEN: GITHUB_TOKEN cannot read this repository
          # from a checkout of the tap, and the download below needs to reach a
          # draft release's assets.
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ github.ref_name }}
          RELEASE_ID: ${{ needs.publish.outputs.release_id }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          CASK=Casks/sigma-oasis.rb
          API="https://api.github.com/repos/CELCPG/SigmaOasis"
          AUTH="Authorization: Bearer $GH_TOKEN"
          # Fetch the one release the publish job wrote, by id. The release is
          # still a draft, so /releases/download/ and /releases/tags/ both 404
          # even with auth; the /releases *list* endpoint is no longer usable
          # either — it returns an empty array (see the publish job), which is
          # how this step failed on v1.6.0 with "Cannot iterate over null".
          RELEASE_JSON=$(curl -sS --fail-with-body -H "$AUTH" "$API/releases/$RELEASE_ID")
          for pair in "arm arm64" "intel x64"; do
            read -r key arch <<< "$pair"
            ASSET_NAME="Sigma-Oasis-${VERSION}-mac-${arch}.dmg"
            id=$(printf '%s' "$RELEASE_JSON" | jq -r --arg name "$ASSET_NAME" \
              '.assets[] | select(.name == $name) | .id')
            if [[ -z "$id" ]]; then
              echo "::error::No asset named $ASSET_NAME on release $RELEASE_ID ($TAG)"
              printf '%s' "$RELEASE_JSON" | jq -r '.assets[].name' | sed 's/^/visible asset: /'
              exit 1
            fi
            sha=$(curl -sfL -H "$AUTH" -H "Accept: application/octet-stream" \
              "$API/releases/assets/$id" | shasum -a 256 | cut -d' ' -f1)
            if ! [[ "$sha" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::Could not checksum the $arch DMG for $VERSION"
              exit 1
            fi
            sed -i -E "s|(${key}: +)\"[0-9a-f]{64}\"|\1\"${sha}\"|" "$CASK"
          done
          sed -i -E "s|^  version \".*\"|  version \"${VERSION}\"|" "$CASK"
          grep -E "version |arm:|intel:" "$CASK"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/sigma-oasis.rb
          if git diff --cached --quiet; then
            echo "Cask already up to date — nothing to push."
          else
            git commit -m "sigma-oasis ${GITHUB_REF_NAME#v}"
            git push
          fi
