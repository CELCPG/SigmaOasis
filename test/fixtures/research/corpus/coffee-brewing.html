<!doctype html><html><head><title>Brewing ratios and water temperature for pour-over coffee</title></head>
<body><main><h1>Brewing ratios and water temperature</h1>
<p>A common starting ratio for pour-over is 1:16 — 15 g of coffee to 240 g of water. Water just off the boil, between 92°C and 96°C, extracts well without scorching.</p>
<p>Total brew time for a single cup is typically 2.5 to 3.5 minutes.</p>
</main></body></html>
