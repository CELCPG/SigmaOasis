<!doctype html><html><head><title>Home battery storage: cycle life explained</title></head>
<body><main><h1>Home battery cycle life</h1>
<p>Modern lithium iron phosphate home batteries are warranted for 6,000 full charge cycles to 70% of original capacity.</p>
<p>Cycle life is not the same as calendar life, and manufacturers differ in how they state the two. This guide covers cycles only.</p>
</main></body></html>
