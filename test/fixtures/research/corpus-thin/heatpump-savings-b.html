<body><main><h1>Air-source heat pump bill impact — Study B</h1>
<p>Our monitored trial of 340 properties found an average reduction in annual heating bills of 45% after switching from gas.</p>
<p>We attribute the difference from earlier surveys to our sample being limited to homes that also upgraded controls.</p>
