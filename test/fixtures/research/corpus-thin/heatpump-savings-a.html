<!doctype html><html><head><title>Household energy report: heat pump running costs (Survey A)</title></head>
<body><main><h1>Heat pump running costs — Survey A</h1>
<p>Across the 1,200 homes in our panel, switching from a gas boiler to an air-source heat pump cut annual heating bills by 30% on average.</p>
<p>The figure varies widely with insulation quality: poorly insulated homes saw as little as 8%.</p>
</main></body></html>
