appId: com.sigmaoasis.app
productName: Sigma Oasis
directories:
  output: dist
  buildResources: build
# Releases are published to GitHub Releases by .github/workflows/release.yml.
# Owner/repo are inferred from the git remote locally and from the Actions
# environment in CI, so nothing here needs to change if the repo is renamed.
#
# This config stays even though the workflow builds with `--publish never`:
# electron-builder needs a publish provider to generate the auto-update
# metadata (latest*.yml), which it writes regardless of publish state. The
# workflow uploads the assets itself; see the `publish` job for why.
publish:
  provider: github
files:
  - out/**
  - package.json
asar: true
# The Workbench's Python runtime (Pyodide, WASM). Fetched by scripts/fetch-pyodide.sh;
# outside the asar so the sandbox window can be served the files by path.
extraResources:
  - from: resources/pyodide
    to: pyodide
  # The curated reference packs (v1.7.1): ~700K of public-domain text. Bundled
  # so an installed app can populate the Almanac with one click and no network
  # — before this, the curated tranche only existed for people who cloned the
  # repo. sources/ holds build specs, not documents; users never need it.
  - from: packs
    to: packs
    filter:
      - '**/*'
      - '!sources/**'
mac:
  category: public.app-category.productivity
  # Both architectures, so Intel Macs get a native build rather than Rosetta.
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  # "Sigma-Oasis", not ${productName}: productName is "Sigma Oasis" with a
  # space, and every asset ever published carries the dashed form because
  # electron-publish sanitized the name as it uploaded. latest*.yml records
  # that sanitized name as the download URL, so the auto-updater looks for
  # `Sigma-Oasis-…`. Now that the workflow uploads the files itself, the name
  # on disk *is* the published name — a space here would upload as
  # `Sigma.Oasis-…` (GitHub rewrites spaces) and break both the updater and
  # the Homebrew cask, silently, for one release. Hard-coded in all three
  # targets for that reason.
  artifactName: Sigma-Oasis-${version}-mac-${arch}.${ext}
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # teamId must be explicit: electron-builder does not map APPLE_TEAM_ID from
  # the environment into the notarytool args on its own ("The teamId property
  # is required when using notarization with password credentials").
  notarize:
    teamId: P85LBTGBM6
  extendInfo:
    NSMicrophoneUsageDescription: Sigma Oasis uses the microphone for push-to-talk voice input, transcribed locally on your Mac.
win:
  target:
    - nsis
  # Dashed literal, matching the published name — see the mac target above.
  artifactName: Sigma-Oasis-${version}-setup.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: Sigma Oasis
linux:
  target:
    - AppImage
  category: Utility
  # Dashed literal, matching the published name — see the mac target above.
  artifactName: Sigma-Oasis-${version}-linux.${ext}
