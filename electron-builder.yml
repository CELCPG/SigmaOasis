appId: com.funkinai.app
productName: FunkinAI
directories:
  output: dist
  buildResources: build
# Releases are published to GitHub Releases by .github/workflows/release.yml.
# Owner/repo are inferred from the git remote locally and from the Actions
# environment in CI, so nothing here needs to change if the repo is renamed.
publish:
  provider: github
files:
  - out/**
  - package.json
asar: true
mac:
  category: public.app-category.productivity
  # Both architectures, so Intel Macs get a native build rather than Rosetta.
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  artifactName: ${productName}-${version}-mac-${arch}.${ext}
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
  extendInfo:
    NSMicrophoneUsageDescription: FunkinAI uses the microphone for push-to-talk voice input, transcribed locally on your Mac.
win:
  target:
    - nsis
  artifactName: ${productName}-${version}-setup.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: FunkinAI
linux:
  target:
    - AppImage
  category: Utility
  artifactName: ${productName}-${version}-linux.${ext}
